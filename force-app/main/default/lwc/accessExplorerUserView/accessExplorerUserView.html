<template>
  <div class="view">
    <div class="user-bar">
      <template lwc:if={showPicker}>
        <div class="user-picker">
          <lightning-record-picker
            class="picker"
            label="User"
            placeholder="Search users by name or username"
            object-api-name="User"
            filter={userFilter}
            display-info={displayInfo}
            matching-info={matchingInfo}
            onchange={handleUserPicked}
          ></lightning-record-picker>
          <template lwc:if={hasUser}>
            <lightning-button
              class="cancel-change"
              label="Cancel"
              onclick={handleCancelChange}
            ></lightning-button>
          </template>
        </div>
      </template>
      <template lwc:else>
        <div class="user-summary">
          <lightning-icon
            icon-name="standard:user"
            size="small"
            alternative-text="User"
          ></lightning-icon>
          <div class="user-text">
            <h2 class="user-name slds-truncate">{userName}</h2>
            <p class="user-meta slds-truncate slds-text-body_small">
              {userMeta}
            </p>
          </div>
          <lightning-button
            class="change-user"
            label="Change user"
            icon-name="utility:change_owner"
            onclick={handleChangeUser}
          ></lightning-button>
        </div>
      </template>
    </div>

    <template lwc:if={userError}>
      <div
        class="slds-notify slds-notify_alert slds-alert_error user-error"
        role="alert"
      >
        {userError}
      </div>
    </template>

    <template lwc:if={hasUser}>
      <div class="panes">
        <nav class="pane pane_nav" aria-label="Access categories">
          <div class="pane-body">
            <template lwc:if={entitiesLoading}>
              <div class="slds-is-relative loading">
                <lightning-spinner
                  alternative-text="Loading accessible items"
                  size="small"
                ></lightning-spinner>
              </div>
            </template>
            <template lwc:if={entitiesError}>
              <div
                class="slds-notify slds-notify_alert slds-alert_error entities-error"
                role="alert"
              >
                {entitiesError}
              </div>
            </template>
            <lightning-vertical-navigation
              class="category-nav"
              selected-item={category}
              onselect={handleCategorySelect}
              compact
            >
              <lightning-vertical-navigation-section label="Categories">
                <template for:each={categories} for:item="item">
                  <lightning-vertical-navigation-item-badge
                    key={item.entityType}
                    label={item.label}
                    name={item.entityType}
                    badge-count={item.count}
                    assistive-text={item.assistiveText}
                  ></lightning-vertical-navigation-item-badge>
                </template>
              </lightning-vertical-navigation-section>
            </lightning-vertical-navigation>
          </div>
        </nav>

        <section class="pane" aria-label="Accessible items">
          <div class="pane-header">
            <h3 class="slds-text-title_caps pane-title slds-truncate">
              {categoryLabel}
            </h3>
            <lightning-input
              class="filter"
              type="search"
              label="Filter accessible items"
              variant="label-hidden"
              placeholder="Filter all categories"
              value={filterTerm}
              onchange={handleFilterChange}
            ></lightning-input>
            <lightning-button-icon
              class="export"
              icon-name="utility:download"
              variant="border-filled"
              size="small"
              alternative-text="Export this category to CSV"
              title="Export this category to CSV"
              disabled={exportDisabled}
              onclick={handleExport}
            ></lightning-button-icon>
          </div>
          <div class="pane-body">
            <c-access-explorer-entity-list
              items={categoryItems}
              user-id={userId}
              selected-type={selectedType}
              selected-key={selectedKey}
              empty-message={emptyMessage}
              onentityselect={handleEntitySelect}
            ></c-access-explorer-entity-list>
          </div>
        </section>

        <section class="pane" aria-label="Access sources">
          <div class="pane-body">
            <c-access-explorer-source-list
              user-id={userId}
              user-name={sourceUserName}
              entity-type={selectedType}
              entity-key={selectedKey}
              entity-label={selectedLabel}
            >
              <lightning-button-icon
                slot="actions"
                class="view-entity"
                icon-name="utility:groups"
                variant="border-filled"
                size="small"
                alternative-text="See everyone with this access"
                title="See everyone with this access"
                disabled={viewEntityDisabled}
                onclick={handleViewEntity}
              ></lightning-button-icon>
            </c-access-explorer-source-list>
          </div>
        </section>
      </div>
    </template>
    <template lwc:else>
      <div class="empty-state slds-text-color_weak">
        <lightning-icon
          icon-name="utility:user"
          size="small"
          class="slds-m-bottom_x-small"
        ></lightning-icon>
        <p>
          Choose a user to see everything they can access and where that access
          comes from.
        </p>
      </div>
    </template>
  </div>
</template>
