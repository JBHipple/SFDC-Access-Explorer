<template>
  <lightning-card title="Access Explorer" icon-name="standard:portal">
    <lightning-button-icon
      slot="actions"
      class="refresh"
      icon-name="utility:refresh"
      variant="border-filled"
      alternative-text="Refresh access data"
      title="Refresh access data"
      disabled={refreshing}
      onclick={handleRefresh}
    ></lightning-button-icon>
    <div class="slds-p-horizontal_medium">
      <lightning-tabset active-tab-value={activeTab}>
        <lightning-tab label="By User" value="user" onactive={handleTabActive}>
          <c-access-explorer-user-view
            selection={userSelection}
            onselectionchange={handleUserSelection}
            onviewentity={handleViewEntity}
          ></c-access-explorer-user-view>
        </lightning-tab>
        <lightning-tab
          label="By Entity"
          value="entity"
          onactive={handleTabActive}
        >
          <c-access-explorer-entity-view
            selection={entitySelection}
            onselectionchange={handleEntitySelection}
            onviewuser={handleViewUser}
          ></c-access-explorer-entity-view>
        </lightning-tab>
      </lightning-tabset>
    </div>
  </lightning-card>
</template>
