<template>
  <div class="picker">
    <lightning-combobox
      class="type-select"
      label="Entity type"
      value={entityType}
      options={typeOptions}
      onchange={handleTypeChange}
      data-id="type-select"
    ></lightning-combobox>
    <template lwc:if={showFieldObject}>
      <lightning-pill
        class="object-pill"
        label={fieldObjectLabel}
        onremove={handleClearObject}
        data-id="object-pill"
      ></lightning-pill>
    </template>
    <c-access-explorer-search-list
      class="results"
      label={searchLabel}
      items={resultItems}
      selected-id={listSelectedId}
      loading={loading}
      truncated={truncated}
      fill
      empty-message="Nothing matches your search."
      onsearch={handleSearch}
      onselect={handleSelect}
    ></c-access-explorer-search-list>
    <template lwc:if={error}>
      <div
        class="slds-notify slds-notify_alert slds-alert_error error"
        role="alert"
      >
        {error}
      </div>
    </template>
  </div>
</template>
