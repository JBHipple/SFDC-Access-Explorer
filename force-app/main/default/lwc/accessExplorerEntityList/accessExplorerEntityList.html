<template>
  <template lwc:if={hasItems}>
    <ul class="entity-items">
      <template for:each={itemViews} for:item="item">
        <li key={item.key} class="entity-item">
          <div class={item.rowClass}>
            <template lwc:if={item.isExpandable}>
              <button
                class="slds-button slds-button_icon object-toggle"
                aria-expanded={item.ariaExpanded}
                aria-controls={item.fieldsId}
                aria-label={item.toggleLabel}
                title={item.toggleLabel}
                data-key={item.key}
                onclick={handleObjectToggle}
              >
                <lightning-icon
                  icon-name={item.chevron}
                  size="xx-small"
                ></lightning-icon>
              </button>
            </template>
            <template lwc:else>
              <span class="toggle-spacer"></span>
            </template>
            <button
              class="slds-button entity-button"
              aria-current={item.ariaCurrent}
              data-type={item.entityType}
              data-key={item.key}
              data-label={item.label}
              onclick={handleSelect}
            >
              <span class="entity-text">
                <span class="slds-truncate entity-label" title={item.label}
                  >{item.label}</span
                >
                <template lwc:if={item.showApiName}>
                  <span
                    class="slds-truncate slds-text-body_small slds-text-color_weak entity-api-name"
                    title={item.apiName}
                    >{item.apiName}</span
                  >
                </template>
              </span>
              <c-access-explorer-permission-badges
                class="entity-badges"
                summary={item.summary}
              ></c-access-explorer-permission-badges>
            </button>
          </div>
          <template lwc:if={item.isExpanded}>
            <div id={item.fieldsId} class="fields">
              <template lwc:if={item.fieldsLoading}>
                <div class="slds-is-relative fields-loading">
                  <lightning-spinner
                    alternative-text="Loading fields"
                    size="x-small"
                  ></lightning-spinner>
                </div>
              </template>
              <template lwc:if={item.fieldsError}>
                <p class="slds-text-color_error fields-error" role="alert">
                  {item.fieldsError}
                </p>
              </template>
              <template lwc:if={item.fieldsEmpty}>
                <p class="slds-text-color_weak fields-empty">
                  No field access.
                </p>
              </template>
              <ul aria-label={item.toggleLabel}>
                <template for:each={item.fields} for:item="field">
                  <li key={field.key} class={field.rowClass}>
                    <button
                      class="slds-button entity-button"
                      aria-current={field.ariaCurrent}
                      data-type="FIELD"
                      data-key={field.key}
                      data-label={field.label}
                      onclick={handleSelect}
                    >
                      <span class="entity-text">
                        <span
                          class="slds-truncate entity-label"
                          title={field.label}
                          >{field.label}</span
                        >
                        <template lwc:if={field.showApiName}>
                          <span
                            class="slds-truncate slds-text-body_small slds-text-color_weak entity-api-name"
                            title={field.apiName}
                            >{field.apiName}</span
                          >
                        </template>
                      </span>
                      <c-access-explorer-permission-badges
                        class="entity-badges"
                        summary={field.summary}
                      ></c-access-explorer-permission-badges>
                    </button>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </li>
      </template>
    </ul>
  </template>
  <template lwc:else>
    <p class="slds-p-around_small slds-text-color_weak empty-message">
      {emptyMessage}
    </p>
  </template>
</template>
