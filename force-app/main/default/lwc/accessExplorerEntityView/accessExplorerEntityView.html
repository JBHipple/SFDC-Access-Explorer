<template>
  <div class="slds-p-around_medium">
    <c-access-explorer-entity-picker
      selected-key={selectedEntityKey}
      onentityselect={handleEntitySelect}
    ></c-access-explorer-entity-picker>

    <template lwc:if={hasEntity}>
      <h2
        class="slds-text-heading_medium slds-m-top_large slds-m-bottom_small entity-heading"
      >
        {entityHeading}
      </h2>
      <lightning-layout multiple-rows>
        <lightning-layout-item
          size="12"
          medium-device-size="6"
          padding="around-small"
        >
          <div
            class="slds-box slds-theme_default panel"
            role="region"
            aria-label="Users with access"
          >
            <c-access-explorer-search-list
              label="Filter users with access"
              placeholder="Search by name or username"
              items={userItems}
              selected-id={selectedUserId}
              loading={usersLoading}
              truncated={usersTruncated}
              empty-message="No active users have this access."
              onsearch={handleUserSearch}
              onselect={handleUserSelect}
            ></c-access-explorer-search-list>
            <template lwc:if={usersError}>
              <div
                class="slds-notify slds-notify_alert slds-alert_error slds-m-top_small users-error"
                role="alert"
              >
                {usersError}
              </div>
            </template>
          </div>
        </lightning-layout-item>
        <lightning-layout-item
          size="12"
          medium-device-size="6"
          padding="around-small"
        >
          <div
            class="slds-box slds-theme_default panel"
            role="region"
            aria-label="Access sources"
          >
            <c-access-explorer-source-list
              user-id={selectedUserId}
              user-name={selectedUserName}
              entity-type={selectedEntityType}
              entity-key={selectedEntityKey}
              entity-label={selectedEntityLabel}
            ></c-access-explorer-source-list>
          </div>
        </lightning-layout-item>
      </lightning-layout>
    </template>
  </div>
</template>
