<template>
  <div class="source-list">
    <div class="header">
      <h3 class="slds-text-title_caps heading">How they get access</h3>
      <div class="actions">
        <slot name="actions"></slot>
        <lightning-button-icon
          icon-name="utility:copy"
          variant="border-filled"
          size="small"
          alternative-text="Copy access summary"
          title="Copy access summary"
          disabled={copyDisabled}
          onclick={handleCopy}
          data-id="copy"
        ></lightning-button-icon>
      </div>
    </div>

    <template lwc:if={hasSelection}>
      <p class="subject">
        <span class="subject-user">{displayUser}</span>
        <lightning-icon
          icon-name="utility:forward"
          size="xx-small"
          class="slds-m-horizontal_x-small"
          alternative-text="has access to"
        ></lightning-icon>
        <span class="subject-entity" title={entityKey}
          >{entityTypeLabel}: {displayEntity}</span
        >
      </p>
      <div aria-live="polite" class="slds-is-relative">
        <template lwc:if={isLoading}>
          <div class="loading">
            <lightning-spinner
              alternative-text="Loading access sources"
              size="small"
            ></lightning-spinner>
          </div>
        </template>
        <template lwc:if={error}>
          <div
            class="slds-notify slds-notify_alert slds-alert_error error"
            role="alert"
          >
            {error}
          </div>
        </template>
        <template lwc:if={isEmpty}>
          <p class="slds-text-color_weak empty-message">
            No profile, permission set or permission set group grants this
            access.
          </p>
        </template>
      </div>
      <template lwc:if={hasSources}>
        <ul class="sources" aria-label="Access sources">
          <template for:each={sourceViews} for:item="source">
            <li key={source.key} class="source">
              <div class="source-main">
                <span class={source.badgeClass}>{source.typeLabel}</span>
                <template lwc:if={source.url}>
                  <a
                    class="source-link slds-truncate"
                    href={source.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    title={source.linkTitle}
                  >
                    {source.name}
                    <lightning-icon
                      icon-name="utility:new_window"
                      size="xx-small"
                      class="slds-m-left_xx-small"
                    ></lightning-icon>
                    <span class="slds-assistive-text"
                      >(opens in a new window)</span
                    >
                  </a>
                </template>
                <template lwc:else>
                  <span class="source-name slds-truncate">{source.name}</span>
                </template>
                <c-access-explorer-permission-badges
                  class="granted"
                  permissions={source.grantedPermissions}
                ></c-access-explorer-permission-badges>
              </div>
              <template lwc:if={source.hasDetails}>
                <p class="details slds-text-body_small slds-text-color_weak">
                  <template lwc:if={source.isImplied}>
                    <span class="implied"
                      >Implied by {source.impliedBy} permission</span
                    >
                  </template>
                  <template lwc:if={source.hasVia}>
                    <span class="via">Via {source.viaText}</span>
                  </template>
                  <template lwc:if={source.isSessionBased}>
                    <span class="session-note"
                      >Session-based: applies only while activated</span
                    >
                  </template>
                </p>
              </template>
            </li>
          </template>
        </ul>
      </template>
    </template>
    <template lwc:else>
      <div class="placeholder slds-text-color_weak">
        <lightning-icon
          icon-name="utility:info"
          size="small"
          class="slds-m-bottom_x-small"
        ></lightning-icon>
        <p>
          Select an item to see which profile, permission sets or groups grant
          the access.
        </p>
      </div>
    </template>
  </div>
</template>
